name: build

# CI：push main / 手动触发 → 编译单文件 exe，产物挂 Artifact（Actions 页下载）。
# push tag（v*）→ 额外创建 GitHub Release 并附 zip —— 面向普通用户的正式发布渠道
#（Artifact 需登录且 90 天过期，Release 公开直链、永久）。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write      # tag 构建时创建 Release 需要

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # tap.dll（预编译入库）与 third-party/vbcable 由 csproj 嵌入；
      # 发布管线（单文件/压缩/无 pdb）也收敛在 csproj 的 Release 组里；
      # 随行安装脚本由 CopyToOutputDirectory 自动进输出目录
      - name: Publish single-file exe
        run: dotnet publish VibeMate -c Release -r win-x64 --self-contained -o release

      - name: List output
        shell: pwsh
        run: Get-ChildItem release | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: VibeMate-win-x64
          path: release
          if-no-files-found: error

      # 发版：tag 推上来时打 zip、建 Release（自动生成 release notes）
      - name: Create release with zip
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Compress-Archive -Path release\* -DestinationPath VibeMate-win-x64.zip
          gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} `
            --generate-notes VibeMate-win-x64.zip
